name: Terra CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: 3. Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Verify Protobuf compilation
      run: |
        python -m grpc_tools.protoc -I protos --python_out=services/ml_engine/src/generated --grpc_python_out=services/ml_engine/src/generated protos/terra.proto
        python -m grpc_tools.protoc -I protos --python_out=services/api_gateway/src/generated --grpc_python_out=services/api_gateway/src/generated protos/terra.proto

    - name: 5. Test RAG Word Chunker logic
      run: |
        python -c "
        import sys
        sys.path.append('.')
        from services.ml_engine.src.rag.vector_store import VectorStore
        vs = VectorStore(db_path='./ci_test_chroma')
        chunks = vs._chunk_text('Тестовый текст для проверки работы нарезки слов и чанкера.', chunk_size=30, overlap=10)
        assert len(chunks) > 0, 'Chunking failed'
        print(' CI Chunking Test Passed!')
        "
